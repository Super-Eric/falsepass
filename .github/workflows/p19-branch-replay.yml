name: P19 temporary branch verification
on:
  push:
    branches:
      - contrib/p19
    paths:
      - "falsepass/**"
      - "tests/**"
      - "README*"
      - "CHANGELOG.md"
      - ".github/workflows/p19-branch-replay.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p19-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Ruff static checks
        run: uvx ruff check .
      - name: Entire pytest suite
        run: uv run --python ${{ matrix.python }} pytest -q
