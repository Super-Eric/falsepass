name: release

# Publishes to PyPI when a GitHub release is published. Needs a trusted publisher for
# this repository and the `pypi` environment configured on pypi.org; no token is stored.
on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv run pytest -q
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    # Lists the new version in the official MCP Registry. Ownership of the
    # io.github.Super-Eric namespace is proven by GitHub's OIDC token; the registry checks
    # the mcp-name line in the README that PyPI shows.
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Wait until PyPI serves this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/falsepass/$version/json" > /dev/null && exit 0
            sleep 10
          done
          echo "falsepass $version is not on PyPI" && exit 1
      - name: Publish to the MCP Registry
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
