[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-refund-desk-toy"
version = "0.1.0"
description = "falsepass example: an OpenEnv tool environment (MCP) with one planted grading defect"
requires-python = ">=3.10"
dependencies = [
    "openenv>=0.9.0",
    "fastmcp>=2.0.0",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.24.0",
]

[tool.setuptools]
packages = ["refund_desk", "refund_desk.server"]
package-dir = { "refund_desk" = ".", "refund_desk.server" = "server" }
