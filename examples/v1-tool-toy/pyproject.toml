[project]
name = "falsepass-v1-tool-toy"
version = "0.1.0"
description = "A tiny verifiers v1 tool taskset (a refund desk) with one planted grading defect, for trying falsepass."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.4.0"]  # tools see the episode state from 0.4.0 on

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["falsepass_v1_tool_toy"]
