[project]
name = "falsepass"
version = "0.1.0"
description = "Probe RL environment verifiers for false passes and false fails."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
rewardlint = ["rewardlint>=0.1.0"]

[project.scripts]
falsepass = "falsepass.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "rewardlint>=0.1.0", "verifiers>=0.3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["falsepass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
